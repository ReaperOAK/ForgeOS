  # ── WebSocket ──
  /ws/tickets:
    get:
      summary: WebSocket for real-time ticket updates
      description: |
        WebSocket endpoint for streaming real-time ticket state changes.

        ## Connection

        Clients initiate a WebSocket upgrade request to this endpoint.
        Authentication is required via the `Sec-WebSocket-Protocol` header
        or a `token` query parameter.

        ```
        GET /api/ws/tickets?token=<bearer-token>
        Connection: Upgrade
        Upgrade: websocket
        ```

        ## Message Format

        All messages are JSON-encoded `WebSocketMessage` objects. The server
        sends events whenever ticket state changes occur (claims, advances,
        rejections, releases, completions).

        ## Subscription Filtering

        After connection, clients may send a `WebSocketSubscription` message
        to filter which events they receive. If no subscription is sent,
        all events are streamed.

        ## Heartbeat

        The server sends a `heartbeat` message every 30 seconds to maintain
        the connection. Clients that do not receive a heartbeat within 60
        seconds should assume the connection is lost and reconnect.

        ## Reconnection

        Clients should implement exponential backoff reconnection with a
        maximum interval of 30 seconds. On reconnect, re-send the
        subscription filter.

        ## Message Types

        | Type | Description | Ticket Present | Event Present |
        |------|-------------|:-:|:-:|
        | `ticket_created` | New ticket was created | Yes | Yes |
        | `ticket_claimed` | Agent claimed a ticket | Yes | Yes |
        | `ticket_released` | Agent released or lease expired | Yes | Yes |
        | `ticket_advanced` | Ticket moved to next stage | Yes | Yes |
        | `ticket_rejected` | Ticket sent back to rework | Yes | Yes |
        | `ticket_updated` | Ticket metadata updated | Yes | Yes |
        | `ticket_escalated` | Rework limit exceeded | Yes | Yes |
        | `ticket_completed` | Ticket reached DONE | Yes | Yes |
        | `system_alert` | System notification | No | No |
        | `heartbeat` | Server liveness ping | No | No |
      operationId: wsTickets
      tags:
        - WebSocket
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: |
            Bearer token for WebSocket authentication (alternative to
            Sec-WebSocket-Protocol header)
      responses:
        '101':
          description: |
            Switching Protocols — WebSocket connection established.
            Server will begin streaming `WebSocketMessage` frames.
          headers:
            Upgrade:
              schema:
                type: string
                const: websocket
            Connection:
              schema:
                type: string
                const: Upgrade
        '401':
          description: Authentication failed
          content:
