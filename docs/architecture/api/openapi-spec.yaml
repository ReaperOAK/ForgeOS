  # ── Health Check ──
  /health:
    get:
      summary: Health check
      description: |
        Combined readiness and liveness probe for the ForgeOS server.

        **Liveness**: Returns HTTP 200 if the server process is running
        and responding. Use for container liveness probes.

        **Readiness**: Returns HTTP 200 with `status: healthy` if the
        server can serve traffic (database connected, migrations applied,
        connection pool available). Returns HTTP 503 with `status: unhealthy`
        if the server cannot serve traffic. Use for container readiness probes
        and load balancer health checks.

        This endpoint does NOT require authentication.
      operationId: healthCheck
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Server is healthy and ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
