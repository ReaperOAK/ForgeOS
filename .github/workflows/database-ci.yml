# =============================================================================
# ForgeOS — Database Migration CI Pipeline
# =============================================================================
# Validates Alembic migrations against a clean PostgreSQL 17 instance:
#   1. Applies all migrations from scratch
#   2. Validates the resulting schema (tables, indexes, enums, triggers)
#   3. Rolls back the most recent migration and reapplies it
#   4. Reports which migrations were applied and execution times
#
# Fails on any migration apply or rollback error.
# Uses PostgreSQL 17-alpine — same version as production (infra/docker-compose.yml).
#
# Ticket: FORGEOS-DO006
# =============================================================================

name: Database Migration CI

# Trigger configuration: runs only when migration-relevant files change.
# Path filters prevent unnecessary CI runs when unrelated code is modified.
on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/alembic/**'          # Migration scripts (versions/, env.py)
      - 'mcp-server/alembic.ini'          # Alembic configuration
      - 'mcp-server/pyproject.toml'       # Python deps (may affect alembic)
      - '.github/workflows/database-ci.yml'  # This workflow itself
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/alembic/**'
      - 'mcp-server/alembic.ini'
      - 'mcp-server/pyproject.toml'
      - '.github/workflows/database-ci.yml'

# Concurrency: one run per branch. Cancel in-progress runs on new pushes
# to avoid wasting CI minutes during rapid iteration.
concurrency:
  group: db-migration-ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: read-only. The workflow validates, never mutates.
permissions:
  contents: read

# =============================================================================
# Jobs
# =============================================================================
jobs:
  migration-ci:
    name: "Database Migration Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Service container: ephemeral PostgreSQL 17-alpine for migration testing.
    # Credentials are CI-only — never shared with production environments.
    # Health check ensures the database accepts connections before steps run.
    services:
      postgres:
        # Same version as production: postgres:17-alpine (infra/docker-compose.yml)
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forgeos_migration_test
          POSTGRES_USER: forgeos
          POSTGRES_PASSWORD: forgeos_migration_ci   # CI-only ephemeral credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeos -d forgeos_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s

    # DATABASE_URL connects to the ephemeral service container above.
    # Same format used by Alembic env.py for connection configuration.
    env:
      DATABASE_URL: "postgresql://forgeos:forgeos_migration_ci@localhost:5432/forgeos_migration_test"

    defaults:
      run:
        working-directory: mcp-server

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-server/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # -----------------------------------------------------------------------
      # Step 1: Apply all migrations from scratch
      # -----------------------------------------------------------------------
      # Runs `alembic upgrade head` on a clean database. Measures apply duration
      # and captures head revision as output variables for the summary report.
      # Error handling: PIPESTATUS[0] after `tee` captures alembic exit code.
      - name: Apply all migrations to clean database
        id: apply_migrations
        run: |
          echo "## Migration Apply Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Record start time
          START_TIME=$(date +%s%N)

          # Show current migration state (should be empty/clean)
          echo "### Pre-migration state" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          alembic current 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List all available migrations
          echo "### Available migrations" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          alembic history --verbose 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Apply all migrations with verbose output
          echo "### Applying all migrations..." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          APPLY_START=$(date +%s%N)
          alembic upgrade head 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          APPLY_STATUS=${PIPESTATUS[0]}
          APPLY_END=$(date +%s%N)
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Calculate apply duration
          APPLY_DURATION_MS=$(( (APPLY_END - APPLY_START) / 1000000 ))
          echo "apply_duration_ms=${APPLY_DURATION_MS}" >> $GITHUB_OUTPUT
          echo "**Apply duration:** ${APPLY_DURATION_MS}ms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $APPLY_STATUS -ne 0 ]; then
            echo "::error::Migration apply failed with exit code $APPLY_STATUS"
            echo "❌ **Migration apply FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ **All migrations applied successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show final migration state
          echo "### Post-migration state" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          alembic current 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Record head revision for later use
          HEAD_REV=$(alembic heads 2>&1 | head -1 | awk '{print $1}')
          echo "head_revision=${HEAD_REV}" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 2: Validate schema — 7 tables, 5 enums, 20 indexes, 3 triggers — tables, indexes, enums, triggers
      # -----------------------------------------------------------------------
      # Queries pg_catalog and information_schema to verify all expected objects.
      # Fails with ::error:: annotation if any expected object is missing.
      - name: Validate database schema
        run: |
          echo "## Schema Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VALIDATION_FAILED=0

          # Expected tables from initial migration
          EXPECTED_TABLES="projects agents sessions tickets file_locks events system_config"

          echo "### Table validation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for TABLE in $EXPECTED_TABLES; do
            EXISTS=$(PGPASSWORD=forgeos_migration_ci psql -h localhost -U forgeos -d forgeos_migration_test -tAc \
              "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_schema='public' AND table_name='${TABLE}');")
            if [ "$EXISTS" = "t" ]; then
              echo "✓ Table '${TABLE}' exists"
              echo "✓ Table '${TABLE}' exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "✗ Table '${TABLE}' MISSING"
              echo "✗ Table '${TABLE}' MISSING" >> $GITHUB_STEP_SUMMARY
              VALIDATION_FAILED=1
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Expected enum types
          EXPECTED_ENUMS="ticket_status ticket_stage ticket_type ticket_priority event_type"

          echo "### Enum type validation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for ENUM in $EXPECTED_ENUMS; do
            EXISTS=$(PGPASSWORD=forgeos_migration_ci psql -h localhost -U forgeos -d forgeos_migration_test -tAc \
              "SELECT EXISTS (SELECT 1 FROM pg_type WHERE typname='${ENUM}');")
            if [ "$EXISTS" = "t" ]; then
              echo "✓ Enum '${ENUM}' exists"
              echo "✓ Enum '${ENUM}' exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "✗ Enum '${ENUM}' MISSING"
              echo "✗ Enum '${ENUM}' MISSING" >> $GITHUB_STEP_SUMMARY
              VALIDATION_FAILED=1
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Expected indexes (key query-path indexes from initial migration)
          EXPECTED_INDEXES="idx_tickets_stage idx_tickets_status idx_tickets_type idx_tickets_priority idx_tickets_claimed_by idx_tickets_project_id idx_tickets_claimable idx_tickets_expired_leases idx_tickets_depends_on idx_tickets_file_paths idx_tickets_tags idx_tickets_metadata idx_events_ticket_id idx_events_event_type idx_events_agent_id idx_events_created_at idx_events_ticket_timeline idx_sessions_agent_id idx_sessions_expires_at idx_file_locks_active"

          echo "### Index validation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          INDEX_COUNT=0
          INDEX_MISSING=0
          for INDEX in $EXPECTED_INDEXES; do
            EXISTS=$(PGPASSWORD=forgeos_migration_ci psql -h localhost -U forgeos -d forgeos_migration_test -tAc \
              "SELECT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='public' AND indexname='${INDEX}');")
            if [ "$EXISTS" = "t" ]; then
              echo "✓ Index '${INDEX}' exists"
              echo "✓ Index '${INDEX}' exists" >> $GITHUB_STEP_SUMMARY
              INDEX_COUNT=$((INDEX_COUNT + 1))
            else
              echo "✗ Index '${INDEX}' MISSING"
              echo "✗ Index '${INDEX}' MISSING" >> $GITHUB_STEP_SUMMARY
              INDEX_MISSING=$((INDEX_MISSING + 1))
              VALIDATION_FAILED=1
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Indexes found:** ${INDEX_COUNT} / $((INDEX_COUNT + INDEX_MISSING))" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Validate triggers exist
          EXPECTED_TRIGGERS="trg_projects_updated_at trg_agents_updated_at trg_tickets_updated_at"

          echo "### Trigger validation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for TRIGGER in $EXPECTED_TRIGGERS; do
            EXISTS=$(PGPASSWORD=forgeos_migration_ci psql -h localhost -U forgeos -d forgeos_migration_test -tAc \
              "SELECT EXISTS (SELECT 1 FROM information_schema.triggers WHERE trigger_schema='public' AND trigger_name='${TRIGGER}');")
            if [ "$EXISTS" = "t" ]; then
              echo "✓ Trigger '${TRIGGER}' exists"
              echo "✓ Trigger '${TRIGGER}' exists" >> $GITHUB_STEP_SUMMARY
            else
              echo "✗ Trigger '${TRIGGER}' MISSING"
              echo "✗ Trigger '${TRIGGER}' MISSING" >> $GITHUB_STEP_SUMMARY
              VALIDATION_FAILED=1
            fi
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Validate the update_updated_at function exists
          echo "### Function validation" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          FUNC_EXISTS=$(PGPASSWORD=forgeos_migration_ci psql -h localhost -U forgeos -d forgeos_migration_test -tAc \
            "SELECT EXISTS (SELECT 1 FROM pg_proc WHERE proname='update_updated_at');")
          if [ "$FUNC_EXISTS" = "t" ]; then
            echo "✓ Function 'update_updated_at' exists"
            echo "✓ Function 'update_updated_at' exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "✗ Function 'update_updated_at' MISSING"
            echo "✗ Function 'update_updated_at' MISSING" >> $GITHUB_STEP_SUMMARY
            VALIDATION_FAILED=1
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check uuid-ossp extension
          EXT_EXISTS=$(PGPASSWORD=forgeos_migration_ci psql -h localhost -U forgeos -d forgeos_migration_test -tAc \
            "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname='uuid-ossp');")
          if [ "$EXT_EXISTS" != "t" ]; then
            echo "::warning::Extension uuid-ossp not found"
            echo "⚠️ Extension uuid-ossp not installed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✓ Extension uuid-ossp installed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $VALIDATION_FAILED -ne 0 ]; then
            echo "::error::Schema validation failed — missing expected database objects"
            echo "❌ **Schema validation FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ **All schema objects validated successfully**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # Step 3: Rollback most recent migration and reapply
      # -----------------------------------------------------------------------
      # Tests reversibility: downgrades latest migration then re-applies to head.
      # For single-migration stacks, downgrades to "base".
      - name: Test migration rollback and reapply
        run: |
          echo "## Rollback & Reapply Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get current head and its parent
          CURRENT=$(alembic current 2>&1 | grep -oP '^\S+' | head -1)
          echo "Current revision: ${CURRENT}"
          echo "**Current revision:** \`${CURRENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get the revision just before head (downgrade target)
          # For single migration, downgrade target is "base"
          HISTORY_COUNT=$(alembic history 2>&1 | grep -c "->")
          if [ "$HISTORY_COUNT" -le 1 ]; then
            DOWNGRADE_TARGET="base"
          else
            DOWNGRADE_TARGET="-1"
          fi
          echo "Downgrade target: ${DOWNGRADE_TARGET}"
          echo "**Downgrade target:** \`${DOWNGRADE_TARGET}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Rollback the most recent migration
          echo "### Rolling back most recent migration..." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ROLLBACK_START=$(date +%s%N)
          alembic downgrade ${DOWNGRADE_TARGET} 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          ROLLBACK_STATUS=${PIPESTATUS[0]}
          ROLLBACK_END=$(date +%s%N)
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ROLLBACK_DURATION_MS=$(( (ROLLBACK_END - ROLLBACK_START) / 1000000 ))
          echo "**Rollback duration:** ${ROLLBACK_DURATION_MS}ms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $ROLLBACK_STATUS -ne 0 ]; then
            echo "::error::Migration rollback failed with exit code $ROLLBACK_STATUS"
            echo "❌ **Rollback FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Rollback succeeded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show state after rollback
          echo "### Post-rollback state" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          alembic current 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Reapply to verify idempotency
          echo "### Reapplying migrations to head..." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          REAPPLY_START=$(date +%s%N)
          alembic upgrade head 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          REAPPLY_STATUS=${PIPESTATUS[0]}
          REAPPLY_END=$(date +%s%N)
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          REAPPLY_DURATION_MS=$(( (REAPPLY_END - REAPPLY_START) / 1000000 ))
          echo "**Reapply duration:** ${REAPPLY_DURATION_MS}ms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $REAPPLY_STATUS -ne 0 ]; then
            echo "::error::Migration reapply failed with exit code $REAPPLY_STATUS"
            echo "❌ **Reapply FAILED**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Reapply succeeded — migration is reversible" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Final state verification
          echo "### Final migration state" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          alembic current 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # Step 4: Summary report with timing
      # -----------------------------------------------------------------------
      # Runs unconditionally (if: always()) so a report is produced even when
      # earlier steps fail. Consumes output variables from Step 1.
      - name: Generate migration report
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Migration CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| PostgreSQL Version | 17-alpine |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | forgeos_migration_test |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Tool | Alembic (asyncpg) |" >> $GITHUB_STEP_SUMMARY
          echo "| Apply Duration | ${{ steps.apply_migrations.outputs.apply_duration_ms }}ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Head Revision | \`${{ steps.apply_migrations.outputs.head_revision }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List all migration files that were processed
          echo "### Migration files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la alembic/versions/*.py 2>/dev/null | grep -v __pycache__ | while read line; do
            echo "$line" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
