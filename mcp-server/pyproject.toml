[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeos-mcp-server"
version = "0.1.0"
description = "ForgeOS MCP Server — Multi-agent orchestration via Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ForgeOS Team" },
]
keywords = ["mcp", "agent", "orchestration", "forgeos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.25,<2",
    "asyncpg>=0.30.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "uvicorn>=0.31.0",
    "alembic>=1.13,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "pyright>=1.1",
]

[project.scripts]
forgeos-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
reportMissingTypeStubs = false
