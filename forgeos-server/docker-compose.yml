services:
  postgres:
    build:
      context: ../infra/docker/postgres
      dockerfile: Dockerfile
    image: forgeos-postgres:17
    environment:
      POSTGRES_DB: forgeos
      POSTGRES_USER: forgeos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "forgeos", "-d", "forgeos" ]
      interval: 10s
      retries: 5
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_password
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=forgeos
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=forgeos
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=50
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password
    restart: unless-stopped

  forgeos-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://forgeos:forgeos_dev@postgres:5432/forgeos
      PORT: ${PORT:-3011}
      NODE_ENV: development
      ADMIN_API_KEY: ${ADMIN_API_KEY:-forgeos-dev-key}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3011/health" ]
      interval: 15s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    ports:
      - "${PORT:-3011}:3011"
    volumes:
      - ../:/workspace:ro
    restart: unless-stopped

volumes:
  pgdata:
    name: pgdata

secrets:
  db_password:
    file: ./secrets/db_password
