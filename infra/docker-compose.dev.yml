# =============================================================================
# ForgeOS — Development Overrides
# =============================================================================
# Layer this on top of the base docker-compose.yml for local development:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What changes from base:
#   - MCP server source code mounted as volume for live reloading (tsx watch)
#   - NODE_ENV set to "development" with debug logging
#   - Dockerfile build target overridden to use dev command
#   - PostgreSQL port exposed for direct access from host tools
#   - pgAdmin always starts (not gated behind profile)
#
# Ticket: FORGEOS-DO001
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MCP Server — Development Mode
  # ---------------------------------------------------------------------------
  # Mounts the source directory and uses tsx watch for hot-reload on file
  # changes. No need to rebuild the image on every code change.
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ../forgeos-server
      dockerfile: Dockerfile
      target: builder
    container_name: forgeos-mcp-dev
    command: [ "npx", "tsx", "watch", "src/index.ts" ]
    environment:
      DATABASE_URL: "postgresql://forgeos:${DB_PASSWORD:-forgeos_dev}@postgres:5432/forgeos"
      PORT: "3011"
      NODE_ENV: development
      LOG_LEVEL: debug
      ADMIN_API_KEY: "forgeos_dev_key_12345678"
      DEFAULT_LEASE_MINUTES: "30"
      MAX_LEASE_MINUTES: "120"
      RECONCILIATION_INTERVAL: "60"
      EMBEDDING_PROVIDER: "ollama"
      EMBEDDING_MODEL: "mxbai-embed-large"
      OLLAMA_BASE_URL: "http://ollama:11434/api/embed"
      PROMPT_LLM_PROVIDER: "ollama"
      PROMPT_LLM_MODEL: "qwen2.5:7b-instruct"
      OLLAMA_GENERATE_URL: "http://ollama:11434/api/generate"
    volumes:
      # Mount source code for live reloading — changes on host are reflected
      # immediately inside the container without rebuilding.
      - ../forgeos-server/src:/app/src:ro
      - ../forgeos-server/package.json:/app/package.json:ro
      - ../forgeos-server/tsconfig.json:/app/tsconfig.json:ro
    ports:
      - "3011:3011"
      # Node.js debugger port for attaching VS Code debugger
      - "9229:9229"
    depends_on:
      ollama:
        condition: service_started

  # ---------------------------------------------------------------------------
  # PostgreSQL — Development Overrides
  # ---------------------------------------------------------------------------
  # Adds verbose logging for query debugging during development.
  # ---------------------------------------------------------------------------
  postgres:
    environment:
      POSTGRES_DB: forgeos
      POSTGRES_USER: forgeos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Enable verbose query logging for development debugging
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=0"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"

  # ---------------------------------------------------------------------------
  # Ollama — Local LLM & Embedding Server
  # ---------------------------------------------------------------------------
  # Serves two models:
  #   mxbai-embed-large  — 1024-dim embeddings for pgvector semantic search
  #   qwen2.5:7b-instruct — prompt compilation (lightweight, local-first)
  #
  # Models are pulled once by ollama-init and cached in the ollama-data volume.
  # On GPU hosts Ollama auto-detects CUDA/ROCm; falls back to CPU silently.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: forgeos-ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - forgeos-net
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # Pulls required models once; exits when done. Re-running is safe (noop if already present).
  ollama-init:
    image: ollama/ollama:latest
    container_name: forgeos-ollama-init
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: >
      -c "until ollama list > /dev/null 2>&1; do echo 'Waiting for Ollama...'; sleep 3; done;
          echo 'Pulling mxbai-embed-large...'; ollama pull mxbai-embed-large;
          echo 'Pulling qwen2.5:7b-instruct...'; ollama pull qwen2.5:7b-instruct;
          echo 'Models ready.'"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - forgeos-net
    restart: "no"

volumes:
  ollama-data:
    name: forgeos-ollama-data
    driver: local
