# =============================================================================
# ForgeOS — Grafana Datasource Provisioning
# =============================================================================
# Auto-configures Prometheus as the default data source on Grafana startup.
# No manual configuration needed — Grafana reads this file on boot.
#
# Ticket:  FORGEOS-DO008
# Author:  DevOps Engineer
# Date:    2026-03-07
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
    version: 1
